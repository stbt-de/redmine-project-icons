  text_project_icons_none: Kein Icon und keine Farbe – das Projekt erscheint wie bisher.
  text_project_icons_icon_hint: "PNG, JPG, WebP, GIF oder SVG, höchstens 2 MB. Rasterbilder werden ganz sichtbar auf %{size} × %{size} px gebracht. Ohne Icon erscheint eine Kachel mit dem Anfangsbuchstaben in der Projektfarbe."
  text_project_icons_inherited_icon: "Ohne eigenes Icon gilt das von „%{project}“."
