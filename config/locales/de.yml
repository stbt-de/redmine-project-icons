  text_project_icons_inherited_color: "Ohne eigene Farbe gilt die von „%{project}“."
  text_project_icons_color_unused: Derzeit nicht sichtbar – für dieses Projekt gilt ein Icon.
  error_project_icons_blank: Bitte eine Bilddatei auswählen.
  error_project_icons_too_large: Die Datei ist größer als 2 MB.
  error_project_icons_type: Dieses Dateiformat wird nicht unterstützt (erlaubt sind PNG, JPG, WebP, GIF und SVG).
  error_project_icons_processing: Das Bild konnte nicht verarbeitet werden.
  error_project_icons_color: Bitte eine gültige Farbe angeben (z. B. #1d4ed8).

  text_project_icons_settings_intro: Wo Projekt-Icons erscheinen. Icon und Farbe werden in den Einstellungen jedes Projekts gepflegt (Reiter „Darstellung“).
  field_project_icons_show_in_project_list: Projektliste
  field_project_icons_show_in_issue_lists: Ticketlisten
  field_project_icons_show_in_header: Kopf und Projektauswahl
  field_project_icons_show_in_planning: Kalender und Gantt
  text_project_icons_show_in_project_list: Icons vor Haupt- und Unterprojekten.
  text_project_icons_show_in_issue_lists: Icon vor dem Projektnamen in der Spalte „Projekt“ (Tickets, Zeiten, Meine Seite, Versionen).
  text_project_icons_show_in_header: Icon vor dem Projekttitel und in „Zu einem Projekt springen“.
  text_project_icons_show_in_planning: Icon vor Tickets im Kalender und vor Projekten im Gantt-Diagramm.
